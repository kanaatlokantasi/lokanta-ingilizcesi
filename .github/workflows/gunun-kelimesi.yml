name: Günün 5 kelimesi
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@12
      - run: node gonder-bildirim.js
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
